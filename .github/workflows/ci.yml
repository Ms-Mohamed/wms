name: CI

on:
  push:
  pull_request:

jobs:
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests via Docker Compose test profile
        run: |
          # Start dependencies (db) in the background
          docker compose --profile test up -d db
          
          # Run Python DB tests
          docker compose --profile test run --rm test-python-db
          
          # Run Python API Analytics tests
          docker compose --profile test run --rm test-python-api
          
          # Run .NET tests
          docker compose --profile test run --rm test-dotnet
          
      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
